[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-intelligence"
version = "0.1.0"
description = "A production-oriented evidence-backed Competitive Intelligence Monitoring Agent using Agentic RAG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Engineering Team" }
]
dependencies = [
    # Core & Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.11.0",
    # Relational Persistence & Migrations
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    # Metrics & Observability
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
# Subsystem 1: Acquisition
acquisition = [
    "crawl4ai>=0.4.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
]

# Subsystem 2: Knowledge Pipeline & Embeddings
knowledge = [
    "llama-index-core>=0.11.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "torch>=2.2.0",
]

# Subsystem 3 & 4: Retrieval & Agentic RAG
agentic = [
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
]

# Subsystem 6: API Backend
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

# Development & Testing
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

all = [
    "competitive-intelligence[acquisition,knowledge,agentic,api,dev]"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
markers = [
    "integration: mark test as integration test requiring external network or real services",
]
